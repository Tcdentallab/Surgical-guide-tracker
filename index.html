<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC Dental Lab — Surgical Guide Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ec;
  --surface: #ffffff;
  --s2: #edeae3;
  --border: #ddd8cf;
  --text: #1a1714;
  --muted: #8a8078;
  --navy: #1a2744;
  --gold: #c8973a;
  --gold-lt: #f5e4c0;
  --teal: #2a7a6a;
  --teal-lt: #d0ede8;
  --rose: #c0394a;
  --rose-lt: #fde0e3;
  --blue: #2a55a0;
  --blue-lt: #dae4f5;
  --purple: #7030b0;
  --purple-lt: #ede8f5;
  --green: #2a7a3a;
  --green-lt: #d0edda;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;min-height:100vh;}

/* ── HEADER ── */
.hdr{background:var(--navy);height:54px;display:flex;align-items:center;padding:0 22px;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(26,39,68,.28);}
.logo{font-family:'Playfair Display',serif;font-size:17px;font-weight:900;color:#fff;letter-spacing:-.5px;white-space:nowrap;}
.logo em{color:var(--gold);font-style:italic;font-weight:400;}
.hdr-div{width:1px;height:22px;background:rgba(255,255,255,.12);}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap;}
.sync-badge.local{background:rgba(200,151,58,.12);color:var(--gold);border-color:rgba(200,151,58,.3);}
.sync-badge.live{background:rgba(42,122,58,.15);color:#4aaa5a;border-color:rgba(42,122,58,.3);}
.sync-badge.syncing{background:rgba(42,85,160,.15);color:#6a9af0;border-color:rgba(42,85,160,.3);}
.sync-badge.error{background:rgba(192,57,74,.12);color:var(--rose);border-color:rgba(192,57,74,.3);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.sync-dot.pulse{animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hdr-cnt{font-size:10px;color:rgba(255,255,255,.4);}

/* ── BUTTONS ── */
.btn{padding:6px 13px;border-radius:5px;border:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;transition:all .15s;white-space:nowrap;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:#b8872a;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:#131d35;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--navy);color:var(--navy);}
.btn-ghost-w{background:transparent;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.18);}
.btn-ghost-w:hover{border-color:var(--gold);color:var(--gold);}
.btn-danger{background:var(--rose-lt);color:var(--rose);border:1px solid rgba(192,57,74,.2);}
.btn-danger:hover{background:var(--rose);color:#fff;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-teal:hover{background:#1e6050;}
.btn-sm{padding:4px 10px;font-size:10px;}

/* ── TOOLBAR ── */
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 22px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.fp{padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;transition:all .15s;white-space:nowrap;}
.fp:hover{border-color:var(--navy);color:var(--navy);}
.fp.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.fsep{width:1px;height:14px;background:var(--border);}
.srch-wrap{margin-left:auto;position:relative;}
.srch{background:var(--s2);border:1px solid var(--border);color:var(--text);padding:5px 9px 5px 26px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;width:190px;outline:none;transition:border-color .15s;}
.srch:focus{border-color:var(--navy);}
.srch::placeholder{color:var(--muted);}
.srch-ico{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;pointer-events:none;}

/* ── MAIN ── */
.main{padding:16px 22px;}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:16px;}
.sbox{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 13px;position:relative;overflow:hidden;}
.sbox::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.sbox.c1::before{background:var(--navy);}
.sbox.c2::before{background:var(--blue);}
.sbox.c3::before{background:var(--teal);}
.sbox.c4::before{background:var(--gold);}
.sbox.c5::before{background:var(--rose);}
.sbox.c6::before{background:var(--purple);}
.snum{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;line-height:1;margin-bottom:3px;}
.slbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}

/* ── KANBAN ── */
.kanban{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:start;}
.kcol{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.kcol-hd{padding:9px 10px 7px;border-bottom:1px solid var(--border);}
.kcol-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.kcol-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;}
.kcol-cnt{font-size:9px;background:var(--s2);color:var(--muted);padding:1px 6px;border-radius:10px;}
.kcol-track{font-size:7px;padding:1px 5px;border-radius:3px;font-weight:600;display:inline-block;}
.kcards{padding:6px;display:flex;flex-direction:column;gap:5px;min-height:60px;}

/* ── CARD ── */
.card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 8px 7px;cursor:pointer;transition:all .15s;position:relative;}
.card:hover{border-color:var(--navy);box-shadow:0 3px 10px rgba(26,39,68,.1);transform:translateY(-1px);}
.card-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:6px 0 0 6px;}
.card-id{font-size:8px;color:var(--muted);margin-bottom:2px;}
.card-name{font-family:'Playfair Display',serif;font-size:12px;font-weight:700;line-height:1.2;margin-bottom:1px;padding-right:12px;}
.card-doc{font-size:9px;color:var(--muted);margin-bottom:5px;}
.card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:5px;}
.ctag{font-size:7px;padding:1px 5px;border-radius:3px;font-weight:600;}
.ct-scan{background:var(--blue-lt);color:var(--blue);}
.ct-final{background:var(--gold-lt);color:#8a6010;}
.ct-urgent{background:var(--rose-lt);color:var(--rose);}
.ct-fu{background:var(--purple-lt);color:var(--purple);}
.card-dates{display:flex;flex-direction:column;gap:2px;}
.cdr{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);}
.cdv{color:var(--text);}
.cdv.warn{color:var(--gold);font-weight:600;}
.cdv.hot{color:var(--rose);font-weight:600;}
.prog-bar{height:2px;background:var(--border);border-radius:1px;overflow:hidden;margin-top:5px;}
.prog-fill{height:100%;border-radius:1px;transition:width .3s;}
.urg-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--rose);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.add-card{padding:6px;text-align:center;font-size:9px;color:var(--muted);border:1px dashed var(--border);border-radius:5px;cursor:pointer;transition:all .15s;}
.add-card:hover{border-color:var(--gold);color:var(--gold);}

/* ── OVERLAY BASE ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,.65);z-index:200;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);}
.overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;animation:up .2s ease;box-shadow:0 20px 60px rgba(26,23,20,.3);}
@keyframes up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.mhd{padding:17px 22px 13px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2;}
.mhd-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;}
.mhd-sub{font-size:9px;color:var(--muted);margin-top:2px;}
.xbtn{background:var(--s2);border:1px solid var(--border);color:var(--muted);width:26px;height:26px;border-radius:5px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.xbtn:hover{color:var(--rose);border-color:var(--rose);}
.mbody{padding:17px 22px;}
.mft{padding:11px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface);}

/* ── FORM ── */
.fsec{margin-bottom:18px;}
.fsec-hd{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.fsec-hd::after{content:'';flex:1;height:1px;background:var(--border);}
.fbadge{font-size:8px;padding:1px 7px;border-radius:3px;font-weight:600;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ffull{grid-column:1/-1;}
.fg{display:flex;flex-direction:column;gap:3px;}
label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:500;}
input,select,textarea{background:var(--s2);border:1px solid var(--border);color:var(--text);padding:6px 9px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--navy);}
select option{background:var(--surface);}
textarea{resize:vertical;min-height:52px;}
.trow{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--s2);border:1px solid var(--border);border-radius:6px;}
.tinfo{flex:1;}
.tlbl{font-size:11px;font-weight:500;}
.tsub{font-size:9px;color:var(--muted);margin-top:1px;}
.tgl{width:32px;height:17px;background:var(--border);border-radius:9px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.tgl.on{background:var(--teal);}
.tgl::after{content:'';position:absolute;width:11px;height:11px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s;}
.tgl.on::after{left:18px;}

/* ── DETAIL MODAL ── */
.dmodal{max-width:880px;}
.dhd{background:var(--navy);border-radius:12px 12px 0 0;padding:17px 22px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.dname{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:#fff;line-height:1.1;}
.dsub{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;}
.dtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.dchip{font-size:9px;padding:2px 8px;border-radius:3px;font-weight:600;}
.dbody{display:grid;grid-template-columns:1fr 230px;gap:16px;padding:0 22px 14px;}

/* WORKFLOW */
.wf-wrap{padding:16px 22px 0;}
.wf-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;}
.wf-step{display:flex;gap:10px;padding-bottom:0;}
.wf-left{display:flex;flex-direction:column;align-items:center;width:22px;flex-shrink:0;}
.wf-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:9px;z-index:1;flex-shrink:0;}
.wf-dot.done{border-color:var(--teal);background:var(--teal-lt);color:var(--teal);}
.wf-dot.active{border-color:var(--gold);background:var(--gold-lt);color:#8a6010;box-shadow:0 0 0 3px rgba(200,151,58,.15);}
.wf-dot.skip{border-color:var(--border);background:var(--s2);color:var(--muted);}
.wf-dot.pending{border-color:var(--border);color:var(--muted);}
.wf-line{flex:1;width:1px;background:var(--border);min-height:6px;}
.wf-content{flex:1;padding-bottom:14px;padding-top:1px;}
.wf-name{font-size:11px;font-weight:600;margin-bottom:1px;}
.wf-desc{font-size:9px;color:var(--muted);line-height:1.5;margin-bottom:3px;}
.wf-chip{font-size:9px;padding:1px 7px;border-radius:3px;display:inline-block;}
.wf-chip.set{background:var(--gold-lt);color:#8a6010;}
.wf-chip.done{background:var(--teal-lt);color:var(--teal);}
.wf-chip.none{background:var(--s2);color:var(--muted);}
.parallel-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--border);border-radius:7px;padding:9px;background:rgba(244,241,236,.5);margin-bottom:14px;}
.par-title{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;padding:2px 6px;border-radius:3px;margin-bottom:7px;display:inline-block;}
.par-item{display:flex;gap:7px;margin-bottom:7px;align-items:flex-start;}
.par-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:7px;flex-shrink:0;margin-top:1px;}
.par-dot.done{border-color:var(--teal);background:var(--teal-lt);color:var(--teal);}
.par-dot.active{border-color:var(--gold);background:var(--gold-lt);color:#8a6010;}
.par-name{font-size:10px;font-weight:600;margin-bottom:1px;}
.par-desc{font-size:9px;color:var(--muted);}

/* SIDEBAR */
.dside{display:flex;flex-direction:column;gap:9px;padding-top:16px;}
.scard{background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:10px;}
.scard-t{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:7px;}
.srow{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:10px;border-bottom:1px solid var(--border);}
.srow:last-child{border-bottom:none;}
.sk{color:var(--muted);}
.sv{color:var(--text);text-align:right;}
.sv.warn{color:var(--gold);}
.sv.hot{color:var(--rose);}
.chip{padding:1px 7px;border-radius:3px;font-size:9px;font-weight:600;}
.chip-y{background:var(--teal-lt);color:var(--teal);}
.chip-n{background:var(--surface);color:var(--muted);border:1px solid var(--border);}
.chip-tbd{background:var(--gold-lt);color:#8a6010;}
.chip-hot{background:var(--rose-lt);color:var(--rose);}
.cdown{text-align:center;padding:5px 0;}
.cnum{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;line-height:1;}
.clbl{font-size:8px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;}
.fu-banner{margin:0 22px 10px;background:linear-gradient(135deg,var(--purple-lt),#f8f4ff);border:1px solid rgba(112,48,176,.2);border-radius:7px;padding:9px 12px;display:flex;align-items:flex-start;gap:8px;}
.fu-ico{font-size:16px;flex-shrink:0;}
.fu-title{font-size:11px;font-weight:600;color:#4a2080;margin-bottom:1px;}
.fu-sub{font-size:9px;color:var(--purple);}
.notes-sec{padding:0 22px 14px;}
.notes-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;}
.notes-val{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11px;line-height:1.5;min-height:36px;}
.dft{padding:10px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}

/* ── CONFIG MODAL ── */
.config-modal{max-width:560px;}
.config-section{margin-bottom:22px;}
.config-section h3{font-size:11px;font-weight:600;color:var(--navy);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.config-field{margin-bottom:10px;}
.config-field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.config-field input{width:100%;font-size:11px;}
.config-hint{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5;}
.config-hint a{color:var(--blue);text-decoration:none;}
.config-hint a:hover{text-decoration:underline;}
.config-status{padding:8px 12px;border-radius:6px;font-size:11px;margin-bottom:12px;display:none;}
.config-status.show{display:block;}
.config-status.ok{background:var(--teal-lt);color:var(--teal);border:1px solid rgba(42,122,106,.2);}
.config-status.err{background:var(--rose-lt);color:var(--rose);border:1px solid rgba(192,57,74,.2);}
.config-steps{counter-reset:step;}
.config-step{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start;}
.config-step-num{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.config-step-body{flex:1;}
.config-step-title{font-size:11px;font-weight:600;margin-bottom:3px;}
.config-step-desc{font-size:10px;color:var(--muted);line-height:1.5;}
.config-step-desc code{background:var(--s2);padding:1px 5px;border-radius:3px;font-size:10px;color:var(--text);}
.table-schema{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-top:8px;}
.table-schema-title{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;}
.schema-row{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--border);font-size:10px;}
.schema-row:last-child{border-bottom:none;}
.schema-name{font-weight:600;flex:1;}
.schema-type{color:var(--muted);font-size:9px;background:var(--surface);padding:1px 5px;border-radius:3px;}
.import-area{border:2px dashed var(--border);border-radius:7px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;margin-top:8px;}
.import-area:hover{border-color:var(--teal);background:var(--teal-lt);}
.import-area-icon{font-size:24px;margin-bottom:6px;}
.import-area-title{font-size:12px;font-weight:600;margin-bottom:3px;}
.import-area-sub{font-size:10px;color:var(--muted);}
#csvFileInput{display:none;}

/* ── EXPORT PANEL ── */
.export-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}

/* ── GCAL BADGE ── */
.gcal-badge{display:flex;align-items:center;gap:5px;font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap;cursor:pointer;transition:all .15s;}
.gcal-badge.off{background:rgba(255,255,255,.06);color:rgba(255,255,255,.35);border-color:rgba(255,255,255,.12);}
.gcal-badge.off:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.7);}
.gcal-badge.on{background:rgba(66,133,244,.15);color:#7aadff;border-color:rgba(66,133,244,.3);}
.gcal-badge.syncing{background:rgba(66,133,244,.12);color:#7aadff;border-color:rgba(66,133,244,.2);}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:7px;font-size:11px;z-index:999;animation:toastIn .2s ease;box-shadow:0 4px 16px rgba(26,39,68,.3);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ── RESPONSIVE ── */
@media(max-width:1400px){.kanban{grid-template-columns:repeat(4,1fr);}}
@media(max-width:1000px){.kanban{grid-template-columns:repeat(2,1fr);}.stats{grid-template-columns:repeat(3,1fr);}}
@media(max-width:700px){.kanban{grid-template-columns:1fr;}.stats{grid-template-columns:repeat(2,1fr);}.dbody{grid-template-columns:1fr;}.parallel-box{grid-template-columns:1fr;}}
/* ── DOCTORS VIEW ── */
.view-doctors{display:none;padding:16px 22px;}
.view-doctors.active{display:block;}
.view-cases.active{display:block;}
.view-cases{display:block;}
.dr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px;}
.dr-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px 16px;position:relative;transition:all .15s;}
.dr-card:hover{border-color:var(--navy);box-shadow:0 3px 10px rgba(26,39,68,.08);}
.dr-card-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:9px 0 0 9px;background:var(--navy);}
.dr-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;margin-bottom:2px;}
.dr-practice{font-size:10px;color:var(--muted);margin-bottom:10px;}
.dr-info-row{display:flex;align-items:flex-start;gap:7px;font-size:10px;margin-bottom:5px;color:var(--muted);}
.dr-info-row span:last-child{color:var(--text);}
.dr-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.dr-tag{font-size:8px;padding:2px 7px;border-radius:3px;background:var(--s2);color:var(--muted);}
.dr-tag.has{background:var(--teal-lt);color:var(--teal);}
.dr-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.dr-case-cnt{font-size:10px;color:var(--muted);margin-top:8px;}
.dr-case-cnt strong{color:var(--navy);}

/* ── DR SELECTOR in case form ── */
.dr-select-wrap{position:relative;}
.dr-select-wrap select{width:100%;}
.dr-hint{font-size:9px;color:var(--blue);margin-top:3px;cursor:pointer;}
.dr-hint:hover{text-decoration:underline;}
.dr-preview{background:var(--blue-lt);border:1px solid rgba(42,85,160,.2);border-radius:6px;padding:8px 10px;margin-top:6px;font-size:10px;display:none;}
.dr-preview-name{font-weight:600;color:var(--navy);margin-bottom:3px;}
.dr-preview-row{color:var(--muted);margin-bottom:1px;}
.dr-preview-row span{color:var(--text);}

/* ── DRAG AND DROP ── */
.card.dragging{opacity:.4;transform:scale(.97);}
.kcards.drag-over{background:rgba(42,85,160,.06);border-radius:6px;outline:2px dashed var(--blue);}

/* ── STAGE CONFIRM MODAL ── */
.stage-confirm{max-width:400px;}
.stage-confirm-body{padding:20px 22px;}
.stage-from{font-size:11px;color:var(--muted);margin-bottom:8px;}
.stage-arrow{font-size:20px;color:var(--border);text-align:center;margin:8px 0;}
.stage-to{font-size:13px;font-weight:600;color:var(--navy);}
.stage-warn{font-size:10px;color:var(--gold);background:var(--gold-lt);border:1px solid rgba(200,151,58,.2);border-radius:5px;padding:7px 10px;margin-top:10px;line-height:1.5;}

/* ── HDR NAV TABS ── */
.hdr-nav{display:flex;align-items:stretch;gap:2px;margin-left:4px;}
.hdr-tab{padding:0 14px;display:flex;align-items:center;color:rgba(255,255,255,.45);cursor:pointer;font-size:10px;font-weight:500;letter-spacing:.4px;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;font-family:'IBM Plex Mono',monospace;}
.hdr-tab:hover{color:rgba(255,255,255,.8);}
.hdr-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="logo">TC Dental <em>Lab</em></div>
  <div class="hdr-div"></div>
  <div class="logo" style="font-size:13px;color:rgba(255,255,255,.6);font-family:'IBM Plex Mono',monospace;font-weight:400;">Surgical Guide Tracker</div>
  <div class="hdr-div"></div>
  <nav class="hdr-nav">
    <div class="hdr-tab active" id="tab-cases" onclick="switchView('cases')">📋 Cases</div>
    <div class="hdr-tab" id="tab-doctors" onclick="switchView('doctors')">🏥 Doctors</div>
  </nav>
  <div class="sync-badge local" id="syncBadge">
    <div class="sync-dot"></div>
    <span id="syncLabel">Local mode</span>
  </div>
  <div class="hdr-right">
    <span class="hdr-cnt" id="hdrCnt">0 cases</span>
    <div class="gcal-badge off" id="gcalBadge" onclick="openConfig('gcal')" title="Google Calendar sync">
      <span>📅</span><span id="gcalLabel">Google Cal</span>
    </div>
    <div class="hdr-div"></div>
    <button class="btn btn-ghost-w btn-sm" onclick="openConfig()">⚙ GitHub Settings</button>
    <button class="btn btn-ghost-w btn-sm" onclick="openConfig('import')">↑ Import CSV</button>
    <button class="btn btn-gold btn-sm" id="hdrAddBtn" onclick="openNew()">+ New Case</button>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <span style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-right:2px;">Filter:</span>
  <button class="fp on" onclick="filt('all',this)">All</button>
  <div class="fsep"></div>
  <button class="fp" onclick="filt('pre-records',this)">Pre-Records</button>
  <button class="fp" onclick="filt('in-prep',this)">In Prep</button>
  <button class="fp" onclick="filt('surgery-soon',this)">Surgery &lt;21d</button>
  <button class="fp" onclick="filt('post-surgery',this)">Post-Surgery</button>
  <button class="fp" onclick="filt('final-fu',this)">Final Resto Pending</button>
  <button class="fp" onclick="filt('scan-appl',this)">Scan Appliance</button>
  <button class="fp" onclick="filt('long',this)">4+ Months Out</button>
  <div class="srch-wrap">
    <span class="srch-ico">⌕</span>
    <input class="srch" type="text" placeholder="Patient, doctor, ID…" id="srchBox" oninput="render()">
  </div>
</div>

<!-- MAIN -->
<div class="main view-cases active" id="view-cases">
  <div class="stats">
    <div class="sbox c1"><div class="snum" id="s1" style="color:var(--navy)">0</div><div class="slbl">Active Cases</div></div>
    <div class="sbox c2"><div class="snum" id="s2" style="color:var(--blue)">0</div><div class="slbl">Awaiting Records</div></div>
    <div class="sbox c3"><div class="snum" id="s3" style="color:var(--teal)">0</div><div class="slbl">Lab In Progress</div></div>
    <div class="sbox c4"><div class="snum" id="s4" style="color:var(--gold)">0</div><div class="slbl">Delivery Due 7d</div></div>
    <div class="sbox c5"><div class="snum" id="s5" style="color:var(--rose)">0</div><div class="slbl">Surgery &lt;14 Days</div></div>
    <div class="sbox c6"><div class="snum" id="s6" style="color:var(--purple)">0</div><div class="slbl">Final Resto Pending</div></div>
  </div>
  <div class="kanban" id="board"></div>
</div>

<!-- DOCTORS VIEW -->
<div class="view-doctors" id="view-doctors">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <div>
      <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;">Doctor Directory</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;">All referring doctors and practices. Select from this list when entering a case.</div>
    </div>
    <button class="btn btn-navy" onclick="openDrEdit()">+ Add Doctor</button>
  </div>
  <div id="drSearchWrap" style="margin-top:10px;">
    <input class="srch" style="width:240px;padding-left:10px;" type="text" placeholder="Search doctors…" id="drSearch" oninput="renderDoctors()">
  </div>
  <div class="dr-grid" id="drGrid"></div>
  <div id="drEmpty" style="display:none;text-align:center;padding:40px;color:var(--muted);font-size:12px;">
    No doctors yet. Click <strong>+ Add Doctor</strong> to build your directory.
  </div>
</div>

<!-- ══════════════════════════════════════════════ -->
<!-- CONFIG / GITHUB MODAL                         -->
<!-- ══════════════════════════════════════════════ -->
<div class="overlay" id="configOv">
<div class="modal config-modal">
  <div class="mhd">
    <div>
      <div class="mhd-title">⚙ Settings</div>
      <div class="mhd-sub">Connect GitHub to share data across your team</div>
    </div>
    <button class="xbtn" onclick="closeConfig()">✕</button>
  </div>
  <div class="mbody">

    <!-- TABS -->
    <div style="display:flex;gap:4px;margin-bottom:18px;background:var(--s2);padding:3px;border-radius:6px;">
      <button class="btn" id="tab-connect" style="flex:1;background:var(--navy);color:#fff;font-size:10px;" onclick="showTab('connect')">🐙 GitHub</button>
      <button class="btn btn-ghost" id="tab-gcal" style="flex:1;font-size:10px;" onclick="showTab('gcal')">📅 Google Cal</button>
      <button class="btn btn-ghost" id="tab-import" style="flex:1;font-size:10px;" onclick="showTab('import')">↑ Import CSV</button>
      <button class="btn btn-ghost" id="tab-export" style="flex:1;font-size:10px;" onclick="showTab('export')">↓ Export</button>
      <button class="btn btn-ghost" id="tab-setup" style="flex:1;font-size:10px;" onclick="showTab('setup')">📋 Setup Guide</button>
    </div>

    <!-- GITHUB TAB -->
    <div id="tab-connect-body">
      <div class="config-status" id="connStatus"></div>

      <div style="background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:11px 13px;margin-bottom:14px;font-size:10px;line-height:1.7;color:var(--muted);">
        <strong style="color:var(--text);">How it works:</strong> Your cases and doctors are stored as
        <code style="background:var(--surface);padding:1px 5px;border-radius:3px;">cases.json</code> and
        <code style="background:var(--surface);padding:1px 5px;border-radius:3px;">doctors.json</code>
        in your GitHub repo. Every save commits the updated file. Your team opens the GitHub Pages URL — everyone shares the same live data. Each person enters their own token below (tokens are never shared).
      </div>

      <div class="config-field">
        <label>GitHub Username / Org</label>
        <input id="cfg_owner" placeholder="e.g. tcdental" type="text">
      </div>
      <div class="config-field">
        <label>Repository Name</label>
        <input id="cfg_repo" placeholder="e.g. surgical-guide-tracker" type="text">
        <div class="config-hint">The repo must be public (for GitHub Pages). Create it at <a href="https://github.com/new" target="_blank">github.com/new</a>.</div>
      </div>
      <div class="config-field">
        <label>Branch</label>
        <input id="cfg_branch" placeholder="main" value="main" type="text">
      </div>
      <div class="config-field">
        <label>Personal Access Token (classic)</label>
        <input id="cfg_token" type="password" placeholder="ghp_…" autocomplete="off">
        <div class="config-hint">
          Go to <a href="https://github.com/settings/tokens/new" target="_blank">github.com/settings/tokens/new</a> →
          give it a name → check <strong>repo</strong> scope → Generate token → paste here.
          Each team member creates their own token. Tokens are stored in your browser only.
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn btn-teal" onclick="testGitHub()">Test Connection</button>
        <button class="btn btn-navy" onclick="saveGitHubConfig()">Save & Connect</button>
        <button class="btn btn-danger btn-sm" onclick="clearGitHubConfig()">Disconnect</button>
      </div>
    </div>

    <!-- GCAL TAB -->
    <div id="tab-gcal-body" style="display:none;">
      <div class="config-status" id="gcalStatus"></div>
      <div style="background:var(--blue-lt);border:1px solid rgba(42,85,160,.2);border-radius:7px;padding:11px 13px;margin-bottom:14px;">
        <div style="font-size:11px;font-weight:600;color:var(--blue);margin-bottom:3px;">📅 What syncs to Google Calendar</div>
        <div style="font-size:10px;color:#3a65b0;line-height:1.6;">
          On every case save: <strong>Records Appointment</strong> (teal) and <strong>Surgery Date</strong> (red) are created or updated as all-day events with patient name, doctor, case ID, and notes.
        </div>
      </div>
      <div class="config-steps">
        <div class="config-step">
          <div class="config-step-num">1</div>
          <div class="config-step-body">
            <div class="config-step-title">Create OAuth credentials</div>
            <div class="config-step-desc">Go to <a href="https://console.cloud.google.com" target="_blank">console.cloud.google.com</a> → new project → enable Google Calendar API → Credentials → OAuth 2.0 Client ID (Web app type) → add your GitHub Pages URL as an authorized origin.</div>
          </div>
        </div>
        <div class="config-step">
          <div class="config-step-num">2</div>
          <div class="config-step-body">
            <div class="config-step-title">Paste Client ID and authorize</div>
          </div>
        </div>
      </div>
      <div class="config-field">
        <label>Google OAuth Client ID</label>
        <input id="gcal_clientId" placeholder="xxxxxxxx.apps.googleusercontent.com" type="text">
      </div>
      <div class="config-field">
        <label>Calendar ID</label>
        <input id="gcal_calId" placeholder="primary" value="primary">
      </div>
      <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
        <button class="btn btn-navy" onclick="gcalAuthorize()">🔑 Authorize with Google</button>
        <button class="btn btn-ghost" onclick="saveGcalConfig()">Save Settings</button>
        <button class="btn btn-danger btn-sm" onclick="clearGcalConfig()">Disconnect</button>
      </div>
      <div id="gcalAuthStatus" style="margin-top:8px;font-size:10px;color:var(--muted);"></div>
      <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px;">
        <div style="font-size:10px;font-weight:600;margin-bottom:6px;">Push all existing cases to calendar</div>
        <button class="btn btn-ghost" onclick="gcalSyncAll()">↑ Sync all cases now</button>
      </div>
    </div>

    <!-- IMPORT TAB -->
    <div id="tab-import-body" style="display:none;">
      <p style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.6;">Import cases from a CSV. First row must be headers. Minimum required: <code>Patient Name</code>.</p>
      <div style="margin-bottom:12px;"><button class="btn btn-ghost" onclick="downloadTemplate()">↓ Download CSV Template</button></div>
      <div class="import-area" onclick="document.getElementById('csvFileInput').click()">
        <div class="import-area-icon">📂</div>
        <div class="import-area-title">Click to select a CSV file</div>
        <div class="import-area-sub">or drag and drop here</div>
      </div>
      <input type="file" id="csvFileInput" accept=".csv" onchange="handleCSV(event)">
      <div id="csvPreview" style="margin-top:10px;display:none;">
        <div style="font-size:10px;color:var(--muted);margin-bottom:5px;" id="csvPreviewLabel"></div>
        <div style="background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:8px;max-height:140px;overflow-y:auto;" id="csvPreviewList"></div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn btn-navy" onclick="confirmImport()">Import These Cases</button>
          <button class="btn btn-ghost" onclick="cancelImport()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- EXPORT TAB -->
    <div id="tab-export-body" style="display:none;">
      <p style="font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.6;">Download your data anytime as a backup or to open in Excel / Google Sheets.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-navy" onclick="exportCSV()">↓ Export Cases as CSV</button>
        <button class="btn btn-ghost" onclick="exportJSON()">↓ Export Cases as JSON</button>
        <button class="btn btn-ghost" onclick="exportDoctorsCSV()">↓ Export Doctors as CSV</button>
      </div>
      <div style="margin-top:14px;padding:10px 12px;background:var(--s2);border-radius:6px;font-size:10px;color:var(--muted);line-height:1.6;">
        <strong style="color:var(--text);">Tip:</strong> If you're connected to GitHub, your data is already version-controlled in the repo — every save is a backup with full history.
      </div>
    </div>

    <!-- SETUP GUIDE TAB -->
    <div id="tab-setup-body" style="display:none;">
      <div style="font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6;">
        Complete setup guide — do this once, then share the URL with your team.
      </div>
      <div class="config-steps">
        <div class="config-step">
          <div class="config-step-num">1</div>
          <div class="config-step-body">
            <div class="config-step-title">Create a GitHub account</div>
            <div class="config-step-desc">Go to <a href="https://github.com" target="_blank">github.com</a> and sign up. Free accounts work perfectly.</div>
          </div>
        </div>
        <div class="config-step">
          <div class="config-step-num">2</div>
          <div class="config-step-body">
            <div class="config-step-title">Create a new public repository</div>
            <div class="config-step-desc">Go to <a href="https://github.com/new" target="_blank">github.com/new</a> → name it <code>surgical-guide-tracker</code> → set to Public → check "Add a README file" → Create repository.</div>
          </div>
        </div>
        <div class="config-step">
          <div class="config-step-num">3</div>
          <div class="config-step-body">
            <div class="config-step-title">Upload this HTML file</div>
            <div class="config-step-desc">In your new repo → click "Add file" → "Upload files" → drag this HTML file in → rename it <code>index.html</code> → Commit changes.</div>
          </div>
        </div>
        <div class="config-step">
          <div class="config-step-num">4</div>
          <div class="config-step-body">
            <div class="config-step-title">Turn on GitHub Pages</div>
            <div class="config-step-desc">In your repo → Settings → Pages → Source: "Deploy from a branch" → Branch: main → folder: / (root) → Save. Your URL will be <code>yourusername.github.io/surgical-guide-tracker</code>. Takes ~2 minutes to go live.</div>
          </div>
        </div>
        <div class="config-step">
          <div class="config-step-num">5</div>
          <div class="config-step-body">
            <div class="config-step-title">Create a Personal Access Token</div>
            <div class="config-step-desc">Go to <a href="https://github.com/settings/tokens/new" target="_blank">github.com/settings/tokens/new</a> → Note: "Surgical Guide Tracker" → Expiration: No expiration → Check <strong>repo</strong> scope → Generate token → copy it immediately (shown once only).</div>
          </div>
        </div>
        <div class="config-step">
          <div class="config-step-num">6</div>
          <div class="config-step-body">
            <div class="config-step-title">Connect from the GitHub tab</div>
            <div class="config-step-desc">Go to the GitHub tab → enter your username, repo name, and token → Test Connection → Save & Connect. Each team member does this step with their own token.</div>
          </div>
        </div>
        <div class="config-step">
          <div class="config-step-num">7</div>
          <div class="config-step-body">
            <div class="config-step-title">Share the URL with your team</div>
            <div class="config-step-desc">Send everyone <code>yourusername.github.io/surgical-guide-tracker</code>. Bookmark it. Done.</div>
          </div>
        </div>
      </div>
    </div>

  </div>
  <div class="mft">
    <button class="btn btn-ghost" onclick="closeConfig()">Close</button>
  </div>
</div>
</div>

<!-- ══════════════════════════════════════════════ -->
<!-- EDIT / NEW CASE MODAL                         -->
<!-- ══════════════════════════════════════════════ -->
<div class="overlay" id="editOv">
<div class="modal">
  <div class="mhd">
    <div><div class="mhd-title" id="editTitle">New Case</div><div class="mhd-sub">Fill available fields — update as the case progresses</div></div>
    <button class="xbtn" onclick="closeEdit()">✕</button>
  </div>
  <div class="mbody">

    <div class="fsec">
      <div class="fsec-hd">Case Information</div>
      <div class="fgrid">
        <div class="fg"><label>Patient Name</label><input id="e_pt" placeholder="Last, First" type="text"></div>
        <div class="fg"><label>Case ID</label><input id="e_id" placeholder="SG-2025-001" type="text"></div>
        <div class="fg"><label>Doctor / Practice</label>
          <div class="dr-select-wrap">
            <select id="e_dr" onchange="onDrSelect()">
              <option value="">— Select a doctor —</option>
            </select>
            <div class="dr-hint" onclick="openDrEdit(); closeEdit();">+ Add new doctor to directory</div>
            <div class="dr-preview" id="drPreview">
              <div class="dr-preview-name" id="drPreviewName"></div>
              <div class="dr-preview-row" id="drPreviewPhone"></div>
              <div class="dr-preview-row" id="drPreviewContact"></div>
              <div class="dr-preview-row" id="drPreviewTurnaround"></div>
            </div>
          </div>
        </div>
        <div class="fg"><label>Current Stage</label>
          <select id="e_stage">
            <option value="pre-records">1 · Pre-Records (Scheduling)</option>
            <option value="records-appt">2 · Records Appointment</option>
            <option value="surgery-prep">3 · Surgery Prep + Lab (Parallel)</option>
            <option value="surgery-appt">4 · Surgery Appointment</option>
            <option value="mid-surgery-fu">5 · Mid-Surgery Follow-up</option>
            <option value="final-resto">6 · Final Restoration Decision</option>
            <option value="complete">7 · Complete</option>
          </select>
        </div>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-hd"><span class="fbadge" style="background:var(--blue-lt);color:var(--blue);">STEP 1</span> Scheduling</div>
      <div class="fgrid">
        <div class="fg"><label>Records Appt Date</label><input id="e_recDate" type="date"></div>
        <div class="fg"><label>Records Appt Status</label>
          <select id="e_recStatus"><option value="not-scheduled">Not Scheduled</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option></select>
        </div>
        <div class="fg"><label>Surgery Appt Date</label><input id="e_surDate" type="date"></div>
        <div class="fg"><label>Surgery Appt Status</label>
          <select id="e_surStatus"><option value="not-scheduled">Not Scheduled</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="rescheduled">Rescheduled</option></select>
        </div>
        <div class="fg ffull"><label>Scheduling Notes</label><textarea id="e_schedNotes" placeholder="Patient availability, rescheduling, office contact…"></textarea></div>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-hd"><span class="fbadge" style="background:var(--blue-lt);color:var(--blue);">STEP 2</span> Records Appointment</div>
      <div class="fgrid">
        <div class="fg"><label>Records Completed Date</label><input id="e_recDone" type="date"></div>
        <div class="fg"><label>Files Received</label>
          <select id="e_filesStatus"><option value="pending">Pending</option><option value="partial">Partial — items missing</option><option value="complete">Complete</option></select>
        </div>
        <div class="fg ffull"><label>Missing Files / Notes</label><textarea id="e_filesNotes" placeholder="e.g. Awaiting CBCT from referring office…"></textarea></div>
      </div>
      <div style="margin-top:8px;">
        <div class="trow">
          <div class="tinfo"><div class="tlbl">Requires Scan Appliance</div><div class="tsub">~1% of cases — toggle only if confirmed</div></div>
          <div class="tgl" id="tgl_scan" onclick="tgl('scan')"></div>
        </div>
      </div>
      <div id="scan_ex" style="display:none;margin-top:7px;">
        <div class="fgrid">

// ══════════════════════════════════

// ══════════════════════════════════
const SCHEMA = [

  { name:'Follow-up Notes',     type:'Long text',         key:'fuNotes' },

  { name:'Final Decision Date', type:'Date',              key:'finDecDate' },

// ══════════════════════════════════
// STATE
// ══════════════════════════════════
let cases = [];

let editId = null, detId = null, activeF = 'all';
let drEditId = null;
let tgls = { scan:false, final:false };
let csvImportData = [];

let dragCaseId = null, dragTargetStage = null;
let cfg = JSON.parse(localStorage.getItem('sgv7_cfg') || '{}');

const LOCAL_KEY = 'sgv7_cases';
const DR_KEY    = 'sgv7_doctors';

// ══════════════════════════════════
// GITHUB STORAGE LAYER
// ══════════════════════════════════
function isConnected() {
  return !!(cfg.token && cfg.owner && cfg.repo);
}

function setSyncBadge(state, label) {
  const b=document.getElementById('syncBadge'), l=document.getElementById('syncLabel');
  b.className='sync-badge '+state; l.textContent=label;
  b.querySelector('.sync-dot').className='sync-dot'+(state==='syncing'?' pulse':'');
}

// GitHub Content API helpers
function ghUrl(path) {
  return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
}
function ghHeaders() {
  return { 'Authorization':'token '+cfg.token, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' };
}

async function ghRead(path) {
  const r = await fetch(ghUrl(path), { headers: ghHeaders() });
  if (r.status === 404) return { content: null, sha: null };
  if (!r.ok) throw new Error(`GitHub read failed: ${r.status}`);
  const d = await r.json();
  const content = JSON.parse(atob(d.content.replace(/\n/g,'')));
  return { content, sha: d.sha };
}

async function ghWrite(path, data, sha, message) {
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
    branch: cfg.branch || 'main',
  };
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(path), { method:'PUT', headers:ghHeaders(), body:JSON.stringify(body) });
  if (!r.ok) { const e=await r.json(); throw new Error(e.message||'GitHub write failed'); }
  return r.json();
}

// SHA cache — avoid re-fetching just to get sha before writing
let _sha = { cases: null, doctors: null };

async function loadCases() {
  if (!isConnected()) {
    cases   = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
    doctors = JSON.parse(localStorage.getItem(DR_KEY) || '[]');
    if (!cases.length) seedLocal();
    setSyncBadge('local','Local mode');
    render(); renderDoctors(); return;
  }
  setSyncBadge('syncing','Syncing…');
  try {
    const [cr, dr] = await Promise.all([ghRead('cases.json'), ghRead('doctors.json')]);
    cases   = cr.content || [];
    doctors = dr.content || [];
    _sha.cases   = cr.sha;
    _sha.doctors = dr.sha;
    localStorage.setItem(LOCAL_KEY, JSON.stringify(cases));
    localStorage.setItem(DR_KEY, JSON.stringify(doctors));
    setSyncBadge('live','GitHub live');
    render(); renderDoctors();
  } catch(e) {
    setSyncBadge('error','Sync error');
    cases   = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
    doctors = JSON.parse(localStorage.getItem(DR_KEY)   || '[]');
    if (!cases.length) seedLocal();
    render(); renderDoctors();
    toast('⚠ GitHub unreachable — showing cached data');
  }
}

async function persistCase(c) {
  const idx = cases.findIndex(x=>x.id===c.id);
  if (idx!==-1) cases[idx]=c; else cases.push(c);
  localStorage.setItem(LOCAL_KEY, JSON.stringify(cases));
  if (!isConnected()) return;
  setSyncBadge('syncing','Saving…');
  try {
    const res = await ghWrite('cases.json', cases, _sha.cases, `Update case ${c.id} — ${c.pt}`);
    _sha.cases = res.content.sha;
    setSyncBadge('live','GitHub live');
  } catch(e) {
    setSyncBadge('error','Save failed');
    toast('⚠ Saved locally — GitHub sync failed: '+e.message);
  }
}

async function persistDoctors(msg) {
  localStorage.setItem(DR_KEY, JSON.stringify(doctors));
  if (!isConnected()) return;
  setSyncBadge('syncing','Saving…');
  try {
    const res = await ghWrite('doctors.json', doctors, _sha.doctors, msg||'Update doctor directory');
    _sha.doctors = res.content.sha;
    setSyncBadge('live','GitHub live');
  } catch(e) {
    setSyncBadge('error','Save failed');
    toast('⚠ Saved locally — GitHub sync failed: '+e.message);
  }
}

async function removeCase(c) {
  cases = cases.filter(x=>x.id!==c.id);
  localStorage.setItem(LOCAL_KEY, JSON.stringify(cases));
  if (!isConnected()) return;
  setSyncBadge('syncing','Saving…');
  try {
    const res = await ghWrite('cases.json', cases, _sha.cases, `Delete case ${c.id} — ${c.pt}`);
    _sha.cases = res.content.sha;
    setSyncBadge('live','GitHub live');
  } catch(e) {
    setSyncBadge('error','Delete failed');
    toast('⚠ Deleted locally — GitHub sync failed');
  }
}

// ══════════════════════════════════
// GITHUB CONFIG FUNCTIONS
// ══════════════════════════════════
async function testGitHub() {
  const owner = document.getElementById('cfg_owner').value.trim();
  const repo  = document.getElementById('cfg_repo').value.trim();
  const token = document.getElementById('cfg_token').value.trim();
  const st = document.getElementById('connStatus');
  st.className='config-status show'; st.textContent='Testing connection…';
  try {
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
      headers:{ 'Authorization':'token '+token, 'Accept':'application/vnd.github.v3+json' }
    });
    if (!r.ok) throw new Error(`Repo not found or token invalid (${r.status})`);
    const d = await r.json();
    st.className='config-status show ok';
    st.textContent=`✓ Connected to ${d.full_name} — ${d.private?'private':'public'} repo. Click Save & Connect.`;
  } catch(e) {
    st.className='config-status show err'; st.textContent='✗ '+e.message;
  }
}

function saveGitHubConfig() {
  cfg = {
    owner:  document.getElementById('cfg_owner').value.trim(),
    repo:   document.getElementById('cfg_repo').value.trim(),
    branch: document.getElementById('cfg_branch').value.trim() || 'main',
    token:  document.getElementById('cfg_token').value.trim(),
  };
  localStorage.setItem('sgv7_cfg', JSON.stringify(cfg));
  closeConfig();
  loadCases();
  toast('✓ GitHub connected — syncing…');
}

function clearGitHubConfig() {
  if (!confirm('Disconnect GitHub? Your local data stays intact.')) return;
  cfg = {}; localStorage.removeItem('sgv7_cfg');
  _sha = { cases:null, doctors:null };
  setSyncBadge('local','Local mode');
  closeConfig(); toast('Disconnected from GitHub');
}

// UTILS
// ══════════════════════════════════
function genId() { return `SG-${new Date().getFullYear()}-${String(cases.length+1).padStart(3,'0')}`; }
function du(s) { if(!s) return null; return Math.round((new Date(s)-new Date(new Date().toDateString()))/86400000); }
function fmt(s) { if(!s) return '—'; return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function uc(d) { if(d===null) return ''; if(d<=7) return 'hot'; if(d<=21) return 'warn'; return ''; }
function toast(msg,dur=3000) {
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),dur);
}

// ══════════════════════════════════
// FILTER & RENDER
// ══════════════════════════════════
function filt(f,el) { activeF=f; document.querySelectorAll('.fp').forEach(p=>p.classList.remove('on')); el.classList.add('on'); render(); }

function getFiltered() {
  const q=document.getElementById('srchBox').value.toLowerCase();
  return cases.filter(c=>{
    const ms=!q||[c.pt,c.dr,c.id].some(v=>(v||'').toLowerCase().includes(q));
    let mf=true;
    if(activeF==='pre-records') mf=['pre-records','records-appt'].includes(c.stage);
    else if(activeF==='in-prep') mf=c.stage==='surgery-prep';
    else if(activeF==='surgery-soon'){const d=du(c.surDate);mf=d!==null&&d<=21&&d>=0;}
    else if(activeF==='post-surgery') mf=['mid-surgery-fu','final-resto'].includes(c.stage);
    else if(activeF==='final-fu') mf=c.trackFinal&&c.finDec==='pending';
    else if(activeF==='scan-appl') mf=!!c.needsScan;
    else if(activeF==='long'){const d=du(c.surDate);mf=d!==null&&d>=120;}
    return ms&&mf;
  });
}

function render() {
  const f=getFiltered();
  const board=document.getElementById('board');
  board.innerHTML='';
  STAGES.forEach(st=>{
    const cols=f.filter(c=>c.stage===st.id);
    const trkColor = st.sub==='Scheduling'?'background:var(--blue-lt);color:var(--blue)':
                     st.sub==='Parallel'?'background:var(--gold-lt);color:#8a6010':
                     st.sub==='Post'?'background:var(--purple-lt);color:var(--purple)':
                     'background:var(--green-lt);color:var(--green)';
    const col=document.createElement('div'); col.className='kcol';
    col.innerHTML=`
      <div class="kcol-hd">
        <div class="kcol-top"><div class="kcol-title" style="color:${st.color}">${st.label}</div><div class="kcol-cnt">${cols.length}</div></div>
        <span class="kcol-track" style="${trkColor}">${st.sub}</span>
      </div>
      <div class="kcards" id="kcards-${st.id}"
        ondragover="onDragOver(event,'${st.id}')"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event,'${st.id}')">
        ${cols.map(c=>cardHtml(c,st.color)).join('')}
        <div class="add-card" onclick="openNew('${st.id}')">+ Add</div>
      </div>`;
    board.appendChild(col);
  });
  updateStats(f);
  document.getElementById('hdrCnt').textContent=`${f.length} case${f.length!==1?'s':''}`;
}

function cardHtml(c,color) {
  const sd=du(c.surDate),u=uc(sd),prog=calcProg(c);
  const dr = getDrById(c.dr);
  const drDisplay = dr ? drLabel(dr) : (c.dr||'—');
  const tags=[];
  if(c.needsScan) tags.push(`<span class="ctag ct-scan">Scan Appl</span>`);
  if(c.trackFinal) tags.push(`<span class="ctag ct-final">Final Resto</span>`);
  if(u==='hot') tags.push(`<span class="ctag ct-urgent">⚡ Urgent</span>`);
  if(c.trackFinal&&c.finDec==='pending'&&['mid-surgery-fu','final-resto'].includes(c.stage)) tags.push(`<span class="ctag ct-fu">Follow-up Due</span>`);
  const rdRow=c.recDate?`<div class="cdr"><span>📋</span><span>Records: <span class="cdv ${du(c.recDate)>=0&&du(c.recDate)<=3?'warn':''}">${fmt(c.recDate)}</span></span></div>`:'';
  const sdRow=c.surDate?`<div class="cdr"><span>🔪</span><span>Surgery: <span class="cdv ${u}">${fmt(c.surDate)}${sd!==null?` <em>(${sd}d)</em>`:''}</span></span></div>`:'';
  const dlRow=c.delDate?`<div class="cdr"><span>📦</span><span>Delivery: <span class="cdv">${fmt(c.delDate)}</span></span></div>`:'';
  return `<div class="card" draggable="true" data-id="${c.id}" onclick="openDet('${c.id}')"
    ondragstart="onDragStart(event,'${c.id}')" ondragend="onDragEnd(event)">
    <div class="card-bar" style="background:${color}"></div>
    ${u==='hot'?'<div class="urg-dot"></div>':''}
    <div class="card-id">${c.id}</div>
    <div class="card-name">${c.pt||'—'}</div>
    <div class="card-doc">${drDisplay}</div>
    ${tags.length?`<div class="card-tags">${tags.join('')}</div>`:''}
    <div class="card-dates">${rdRow}${sdRow}${dlRow}</div>
    <div class="prog-bar"><div class="prog-fill" style="width:${prog}%;background:${color}"></div></div>
  </div>`;
}

function calcProg(c) {
  const steps=[c.recStatus==='completed',c.filesStatus==='complete',c.meetStatus==='completed',
    ['surgery-appt','mid-surgery-fu','final-resto','complete'].includes(c.stage),
    c.delStatus==='delivered',c.surStatus==='completed',c.fuStatus==='completed',
    !c.trackFinal||c.finDec!=='pending'];
  return Math.round(steps.filter(Boolean).length/steps.length*100);
}

function updateStats(f) {
  document.getElementById('s1').textContent=f.filter(c=>c.stage!=='complete').length;
  document.getElementById('s2').textContent=f.filter(c=>['pre-records','records-appt'].includes(c.stage)).length;
  document.getElementById('s3').textContent=f.filter(c=>c.stage==='surgery-prep'&&c.fabStart).length;
  document.getElementById('s4').textContent=f.filter(c=>{const d=du(c.delDate);return d!==null&&d<=7&&d>=0;}).length;
  document.getElementById('s5').textContent=f.filter(c=>{const d=du(c.surDate);return d!==null&&d<=14&&d>=0;}).length;
  document.getElementById('s6').textContent=f.filter(c=>c.trackFinal&&c.finDec==='pending').length;
}

  const sd=du(c.surDate);

      desc:`Files: ${c.filesStatus}${c.filesNotes?' — '+c.filesNotes:''}${c.needsScan?' · Scan Appl: '+(c.scanRec?'Received':c.scanOrd?'Ordered':'Needed'):''}`,
      date:c.recDone||c.recDate },
    { name:'Surgery Prep  ⟺  Lab Work', icon:'⚡', color:'var(--gold)', parallel:true,
      schedItems:[{ name:'Pre-Op Prep', desc:c.prepNotes||'Consent, clearance, patient instructions', status:['surgery-appt','mid-surgery-fu','final-resto','complete'].includes(c.stage)?'done':'pending' }],
      labItems:[
        { name:'Design Meeting', desc:`${c.meetStatus}${c.meetDate?' · '+fmt(c.meetDate):''}`, date:c.meetDate, status:c.meetStatus==='completed'?'done':(c.meetDate?'active':'pending') },
        { name:'Guide Fabrication', desc:`${fmt(c.fabStart)} → ${fmt(c.fabEnd)}`, date:c.fabEnd, status:c.delStatus==='delivered'||['surgery-appt','mid-surgery-fu','final-resto','complete'].includes(c.stage)?'done':(c.fabStart?'active':'pending') },
        { name:'Guide Delivery', desc:`${fmt(c.delDate)} · ${c.delStatus}`, date:c.delDate, status:c.delStatus==='delivered'?'done':(c.delDate?'active':'pending') },
      ]},
    { name:'Surgery Appointment', icon:'🏥', color:'var(--teal)',
      status:c.surStatus==='completed'?'done':(c.surDate?'pending':'pending'),
      desc:`${fmt(c.surDate)}${c.surNotes?' — '+c.surNotes:''}`, date:c.surDone||c.surDate },
    { name:'Mid-Surgery Follow-up', icon:'📞', color:'var(--purple)',
      status:c.fuStatus==='completed'?'done':(c.fuDate?'active':'pending'),
      desc:`${c.fuStatus}${c.fuNotes?' — '+c.fuNotes:''}`, date:c.fuDate },
    { name:'Final Restoration Decision', icon:'👑', color:'var(--rose)',
      status:!c.trackFinal?'skip':(c.finDec==='yes'||c.finDec==='no'?'done':(['final-resto'].includes(c.stage)?'active':'pending')),
      desc:!c.trackFinal?'Not tracked for this case':`Doctor decides at/after surgery · ${c.finDec}${c.finDec==='yes'?` · Fab: ${fmt(c.finFabStart)} → ${fmt(c.finFabDel)}`:''}`,
      date:c.finDecDate, notes:c.finNotes },
  ];

  let tlHtml='';
  wfSteps.forEach((s,i)=>{
    const isLast=i===wfSteps.length-1;
    if(s.parallel){
      tlHtml+=`<div class="wf-step">
        <div class="wf-left"><div class="wf-dot active" style="border-color:var(--gold);background:var(--gold-lt);color:#8a6010;">⚡</div>${!isLast?'<div class="wf-line"></div>':''}</div>
        <div class="wf-content">
          <div class="wf-name" style="color:var(--gold)">Step 3 — Parallel Phase</div>
          <div class="parallel-box">
            <div>
              <div class="par-title" style="background:var(--blue-lt);color:var(--blue);">📅 Scheduling Side</div>
              ${s.schedItems.map(si=>`<div class="par-item"><div class="par-dot ${si.status}">${si.status==='done'?'✓':'·'}</div><div><div class="par-name">${si.name}</div><div class="par-desc">${si.desc}</div></div></div>`).join('')}
            </div>
            <div>
              <div class="par-title" style="background:var(--teal-lt);color:var(--teal);">🔬 Lab Side (after Records)</div>
              ${s.labItems.map(li=>`<div class="par-item"><div class="par-dot ${li.status}">${li.status==='done'?'✓':li.status==='active'?'→':'·'}</div><div><div class="par-name">${li.name}</div><div class="par-desc">${li.desc}</div>${li.date?`<span class="wf-chip ${li.status==='done'?'done':'set'}">${fmt(li.date)}</span>`:`<span class="wf-chip none">No date</span>`}</div></div>`).join('')}
            </div>
          </div>
        </div>
      </div>`;
    } else {
      const dc=s.status==='skip'?'skip':s.status;
      const di=s.status==='done'?'✓':s.status==='skip'?'—':s.icon;
      const ds=s.status==='active'?`border-color:${s.color};background:${s.color}22;color:${s.color};box-shadow:0 0 0 3px ${s.color}22;`:'';
      tlHtml+=`<div class="wf-step">
        <div class="wf-left"><div class="wf-dot ${dc}" style="${ds}">${di}</div>${!isLast?'<div class="wf-line"></div>':''}</div>
        <div class="wf-content">
          <div class="wf-name" style="color:${s.status==='pending'||s.status==='skip'?'var(--muted)':s.color}">${s.name}</div>
          <div class="wf-desc">${s.desc}</div>
          ${s.date?`<span class="wf-chip ${s.status==='done'?'done':'set'}">${fmt(s.date)}</span>`:`<span class="wf-chip none">No date set</span>`}
          ${s.notes?`<div style="font-size:9px;color:var(--muted);margin-top:3px;font-style:italic;">${s.notes}</div>`:''}
        </div>
      </div>`;
    }
  });
  document.getElementById('dv_timeline').innerHTML=tlHtml;

  document.getElementById('dv_side').innerHTML=`
    <div class="scard">
      <div class="scard-t">Key Dates</div>
      <div class="srow"><span class="sk">Records Appt</span><span class="sv">${fmt(c.recDate)}</span></div>
      <div class="srow"><span class="sk">Surgery Date</span><span class="sv ${uc(sd)==='hot'?'hot':uc(sd)==='warn'?'warn':''}">${fmt(c.surDate)}</span></div>
      <div class="srow"><span class="sk">Guide Delivery</span><span class="sv">${fmt(c.delDate)}</span></div>
      <div class="srow"><span class="sk">Follow-up</span><span class="sv">${fmt(c.fuDate)}</span></div>
    </div>
    ${c.surDate?`<div class="scard"><div class="cdown">
      <div class="cnum" style="color:${sd<=7?'var(--rose)':sd<=21?'var(--gold)':'var(--navy)'}">${Math.max(0,sd??0)}</div>
      <div class="clbl">${sd>0?'days to surgery':sd===0?'Surgery Today':'surgery '+Math.abs(sd)+'d ago'}</div>
    </div></div>`:''}
    <div class="scard">
      <div class="scard-t">Case Flags</div>
      <div class="srow"><span class="sk">Files</span><span><span class="chip ${c.filesStatus==='complete'?'chip-y':'chip-tbd'}">${c.filesStatus||'pending'}</span></span></div>
      <div class="srow"><span class="sk">Scan Appl.</span><span><span class="chip ${c.needsScan?'chip-y':'chip-n'}">${c.needsScan?'Required':'N/A'}</span></span></div>
      <div class="srow"><span class="sk">Final Resto</span><span><span class="chip ${c.trackFinal?'chip-tbd':'chip-n'}">${c.trackFinal?'Tracked':'No'}</span></span></div>
    </div>
    ${c.trackFinal?`<div class="scard" style="border-color:rgba(112,48,176,.25)">
      <div class="scard-t" style="color:var(--purple)">Final Restoration</div>
      <div class="srow"><span class="sk">Decision</span><span><span class="chip ${c.finDec==='yes'?'chip-y':c.finDec==='no'?'chip-n':'chip-tbd'}">${c.finDec||'pending'}</span></span></div>
      <div class="srow"><span class="sk">Fab Start</span><span class="sv">${fmt(c.finFabStart)}</span></div>
      <div class="srow"><span class="sk">Delivery</span><span class="sv">${fmt(c.finFabDel)}</span></div>
      ${c.finNotes?`<div style="font-size:9px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">${c.finNotes}</div>`:''}
    </div>`:''}`;

  const fub=document.getElementById('dv_fu_banner');
  if(c.trackFinal&&c.finDec==='pending'&&['mid-surgery-fu','final-resto'].includes(c.stage)){
    fub.style.display='block';
    fub.innerHTML=`<div class="fu-banner"><div class="fu-ico">📞</div><div><div class="fu-title">Final Restoration Follow-up Due</div><div class="fu-sub">Contact ${c.dr} to confirm: will they send us the final restoration?${c.fuDate?' Target: '+fmt(c.fuDate):''}</div></div></div>`;
  } else fub.style.display='none';

  document.getElementById('dv_notes').textContent=c.notes||'No notes.';
  document.getElementById('detOv').classList.add('open');
}

function gv(id){const el=document.getElementById(id);return el?el.value:'';}

async function saveCase(){
  const pt=gv('e_pt').trim(); if(!pt){alert('Patient name is required.');return;}
  const btn=document.getElementById('saveCaseBtn');
  btn.textContent='Saving…'; btn.disabled=true;
  const existing=cases.find(x=>x.id===(editId||gv('e_id')));
  const data={
    ...(existing||{}),
    id:editId||gv('e_id')||genId(), pt, dr:gv('e_dr'), stage:gv('e_stage'),
    recDate:gv('e_recDate'), recStatus:gv('e_recStatus'), surDate:gv('e_surDate'), surStatus:gv('e_surStatus'), schedNotes:gv('e_schedNotes'),
    recDone:gv('e_recDone'), filesStatus:gv('e_filesStatus'), filesNotes:gv('e_filesNotes'),
    needsScan:tgls.scan, scanOrd:gv('e_scanOrd'), scanRec:gv('e_scanRec'),
    prepNotes:gv('e_prepNotes'), meetDate:gv('e_meetDate'), meetStatus:gv('e_meetStatus'),
    fabStart:gv('e_fabStart'), fabEnd:gv('e_fabEnd'), delDate:gv('e_delDate'),
    surDone:gv('e_surDone'), delStatus:gv('e_delStatus'), surNotes:gv('e_surNotes'),
    fuDate:gv('e_fuDate'), fuStatus:gv('e_fuStatus'), fuNotes:gv('e_fuNotes'),
    trackFinal:tgls.final, finDec:gv('e_finDec'), finDecDate:gv('e_finDecDate'),
    finFabStart:gv('e_finFabStart'), finFabDel:gv('e_finFabDel'), finNotes:gv('e_finNotes'),
    notes:gv('e_notes'), createdAt:existing?.createdAt||new Date().toISOString().split('T')[0],
  };
  await persistCase(data);

  // Sync to Google Calendar (non-blocking — runs after save)
  if (gcalIsConnected()) {
    syncCaseToGcal(data).then(() => {
      // persist updated gcal event IDs back to storage
      persistCase(data);
    });
  }

  btn.textContent='Save Case'; btn.disabled=false;
  closeEdit(); render();
  const calNote = gcalIsConnected() ? ' + calendar synced' : '';
  toast(isConnected()?`✓ Saved to GitHub${calNote}`:`✓ Saved locally${calNote}`);
}

function downloadTemplate(){

  const ex=`"SG-2025-001","Smith, John","DR-001","pre-records","2025-08-01","scheduled","2025-09-15","scheduled","","","pending","",FALSE,"","","","","not-scheduled","","","","","pending","","","pending","","FALSE","pending","","","","","","${new Date().toISOString().split('T')[0]}"`;
  const blob=new Blob([headers+'\n'+ex],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='surgical_guide_template.csv'; a.click();
}

function handleCSV(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split('\n').filter(l=>l.trim());
    const headers=parseCSVRow(lines[0]);
    csvImportData=[];
    for(let i=1;i<lines.length;i++){
      const vals=parseCSVRow(lines[i]);
      if(!vals.length) continue;
      const row={};
      headers.forEach((h,j)=>{ row[h]=vals[j]||''; });
      // map to case object
      const c={createdAt:new Date().toISOString().split('T')[0]};
      SCHEMA.forEach(s=>{
        const v=row[s.name]||'';
        if(s.type==='Checkbox') c[s.key]=v.toLowerCase()==='true'||v==='1'||v==='yes';
        else c[s.key]=v;
      });
      if(!c.id) c.id=genId()+'_'+i;
      if(!c.pt&&!row['Patient Name']) continue;
      if(!c.pt) c.pt=row['Patient Name'];
      csvImportData.push(c);
    }
    const preview=document.getElementById('csvPreview');
    document.getElementById('csvPreviewLabel').textContent=`Found ${csvImportData.length} case(s) to import:`;
    document.getElementById('csvPreviewList').innerHTML=csvImportData.map(c=>`
      <div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;display:flex;gap:8px;">
        <span style="color:var(--muted);font-size:9px;min-width:70px;">${c.id}</span>
        <span style="font-weight:600;">${c.pt}</span>
        <span style="color:var(--muted);">${c.dr||''}</span>
      </div>`).join('');
    preview.style.display='block';
  };
  reader.readAsText(file);
}

function parseCSVRow(row){
  const results=[]; let cur='', inQ=false;
  for(let i=0;i<row.length;i++){
    const ch=row[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){results.push(cur.trim());cur='';}
    else cur+=ch;
  }
  results.push(cur.trim()); return results;
}

async function confirmImport(){
  for(const c of csvImportData) await persistCase(c);
  csvImportData=[];
  document.getElementById('csvPreview').style.display='none';
  document.getElementById('csvFileInput').value='';
  closeConfig(); render();
  toast(`✓ ${csvImportData.length||'Cases'} imported successfully`);
}

function cancelImport(){
  csvImportData=[];
  document.getElementById('csvPreview').style.display='none';
  document.getElementById('csvFileInput').value='';
}

function saveDr() {

  const data = {

  };

function onDrop(event, targetStage) {

  document.querySelectorAll('.kcards.drag-over').forEach(el=>el.classList.remove('drag-over'));

  const c = cases.find(x=>x.id===dragCaseId);
  if (!c || c.stage===targetStage) { dragCaseId=null; return; }

  dragTargetStage = targetStage;
  const fromSt = STAGES.find(s=>s.id===c.stage);
  const toSt   = STAGES.find(s=>s.id===targetStage);

  // Show confirm modal
  document.getElementById('sc_patient').textContent = `Patient: ${c.pt}`;
  const fromEl = document.getElementById('sc_from');
  fromEl.textContent = fromSt?.label || c.stage;
  const toEl = document.getElementById('sc_to');
  toEl.textContent = toSt?.label || targetStage;
  toEl.style.background = (toSt?.color||'var(--navy)')+'22';
  toEl.style.color = toSt?.color||'var(--navy)';

  // Stage-specific warnings
  const warn = document.getElementById('sc_warn');
  const stageIdx = STAGES.findIndex(s=>s.id===targetStage);
  const fromIdx  = STAGES.findIndex(s=>s.id===c.stage);
  const goingBack = stageIdx < fromIdx;
  if (goingBack) {
    warn.style.display='block';
    warn.textContent='⚠ Moving backwards — some completed fields will still show as done. Update the case after moving if needed.';
  } else { warn.style.display='none'; }

  document.getElementById('stageConfirmOv').classList.add('open');
}

async function confirmDrag() {
  const c = cases.find(x=>x.id===dragCaseId);

}

// ══════════════════════════════════
// GOOGLE CALENDAR INTEGRATION
// ══════════════════════════════════
let gcalCfg = JSON.parse(localStorage.getItem('sgv4_gcal') || '{}');
let gcalToken = null; // in-memory access token (not persisted)

function gcalIsConnected() {
  return !!(gcalCfg.clientId && gcalToken);
}

function updateGcalBadge() {
  const badge = document.getElementById('gcalBadge');
  const label = document.getElementById('gcalLabel');
  if (gcalIsConnected()) {
    badge.className = 'gcal-badge on';
    label.textContent = 'Cal Connected';
  } else if (gcalCfg.clientId) {
    badge.className = 'gcal-badge off';
    label.textContent = 'Cal: Auth needed';
  } else {
    badge.className = 'gcal-badge off';
    label.textContent = 'Google Cal';
  }
}

function saveGcalConfig() {
  gcalCfg.clientId = document.getElementById('gcal_clientId').value.trim();
  gcalCfg.calId    = document.getElementById('gcal_calId').value.trim() || 'primary';
  localStorage.setItem('sgv4_gcal', JSON.stringify(gcalCfg));
  updateGcalBadge();
  showGcalStatus('✓ Settings saved. Click "Authorize with Google" to connect.', 'ok');
}

function clearGcalConfig() {
  if (!confirm('Disconnect Google Calendar? This will not delete existing calendar events.')) return;
  gcalCfg = {}; gcalToken = null;
  localStorage.removeItem('sgv4_gcal');
  updateGcalBadge();
  closeConfig();
  toast('Google Calendar disconnected');
}

function showGcalStatus(msg, type) {
  const el = document.getElementById('gcalStatus');
  el.className = `config-status show ${type === 'ok' ? 'ok' : 'err'}`;
  el.textContent = msg;
}

// OAuth2 implicit flow — opens Google consent popup, gets access token
function gcalAuthorize() {
  const clientId = document.getElementById('gcal_clientId').value.trim() || gcalCfg.clientId;
  if (!clientId) { showGcalStatus('✗ Enter your Google OAuth Client ID first.', 'err'); return; }

  gcalCfg.clientId = clientId;
  gcalCfg.calId    = document.getElementById('gcal_calId').value.trim() || 'primary';
  localStorage.setItem('sgv4_gcal', JSON.stringify(gcalCfg));

  const scope = encodeURIComponent('https://www.googleapis.com/auth/calendar.events');
  const redirect = encodeURIComponent(window.location.href.split('?')[0].split('#')[0]);
  const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${clientId}&redirect_uri=${redirect}&response_type=token&scope=${scope}`;

  document.getElementById('gcalAuthStatus').textContent = 'Opening Google authorization window…';

  const popup = window.open(authUrl, 'gcal_auth', 'width=500,height=600,left=200,top=100');

  // Poll for redirect back with token in URL hash
  const poll = setInterval(() => {
    try {
      if (!popup || popup.closed) { clearInterval(poll); document.getElementById('gcalAuthStatus').textContent = 'Window closed.'; return; }
      const hash = popup.location.hash;
      if (hash && hash.includes('access_token')) {
        clearInterval(poll);
        popup.close();
        const params = new URLSearchParams(hash.slice(1));
        gcalToken = params.get('access_token');
        const expiresIn = parseInt(params.get('expires_in') || '3600');
        // Auto-clear token when it expires
        setTimeout(() => { gcalToken = null; updateGcalBadge(); toast('Google Calendar session expired — re-authorize in settings.'); }, expiresIn * 1000);
        updateGcalBadge();
        showGcalStatus('✓ Google Calendar connected! Dates will sync automatically when you save cases.', 'ok');
        document.getElementById('gcalAuthStatus').textContent = '✓ Authorized successfully.';
      }
    } catch(e) {
      // Cross-origin — keep polling until redirect back to same origin
    }
  }, 500);
}

// Create or update a calendar event for a case date
async function gcalUpsertEvent(c, dateKey, titlePrefix, description) {
  if (!gcalIsConnected()) return;
  const dateStr = c[dateKey];
  if (!dateStr) return;

  const calId = encodeURIComponent(gcalCfg.calId || 'primary');
  const eventTitle = `[SG] ${titlePrefix} — ${c.pt}`;
  const searchKey = `sg_${c.id}_${dateKey}`;

  // Build event body — all-day event
  const nextDay = new Date(dateStr + 'T00:00:00');
  nextDay.setDate(nextDay.getDate() + 1);
  const endDate = nextDay.toISOString().split('T')[0];

  const eventBody = {
    summary: eventTitle,
    description: description,
    start: { date: dateStr },
    end:   { date: endDate },
    extendedProperties: { private: { sgCaseId: c.id, sgDateKey: dateKey } },
    colorId: dateKey === 'surDate' ? '11' : '7', // red for surgery, teal for records
  };

  // Search for existing event we created for this case+dateKey
  const existing = c[`_gcal_${dateKey}`]; // stored eventId

  const headers = {
    'Authorization': 'Bearer ' + gcalToken,
    'Content-Type': 'application/json',
  };

  try {
    let eventId;
    if (existing) {
      // Try to update
      const r = await fetch(
        `https://www.googleapis.com/calendar/v3/calendars/${calId}/events/${existing}`,
        { method: 'PUT', headers, body: JSON.stringify(eventBody) }
      );
      if (r.ok) { eventId = existing; }
      else if (r.status === 404) {
        // Event was deleted on Google side — create fresh
        const cr = await fetch(
          `https://www.googleapis.com/calendar/v3/calendars/${calId}/events`,
          { method: 'POST', headers, body: JSON.stringify(eventBody) }
        );
        if (cr.ok) { const d = await cr.json(); eventId = d.id; }
      }
    } else {
      // Create new
      const r = await fetch(
        `https://www.googleapis.com/calendar/v3/calendars/${calId}/events`,
        { method: 'POST', headers, body: JSON.stringify(eventBody) }
      );
      if (r.ok) { const d = await r.json(); eventId = d.id; }
    }
    if (eventId) c[`_gcal_${dateKey}`] = eventId;
  } catch(e) {
    console.warn('GCal sync failed for', dateKey, e);
  }
}

// Main function — called after saving a case
async function syncCaseToGcal(c) {
  if (!gcalIsConnected()) return;

  const gcalBadge = document.getElementById('gcalBadge');
  gcalBadge.className = 'gcal-badge syncing';

  const stageLabel = STAGES.find(s => s.id === c.stage)?.label || c.stage;
  const baseDesc = `Case: ${c.id}\nPatient: ${c.pt}\nDoctor: ${c.dr}\nStage: ${stageLabel}`;

  const recDesc = `📋 Records Appointment\n${baseDesc}${c.schedNotes ? '\n\nNotes: ' + c.schedNotes : ''}`;
  const surDesc = `🔪 Surgery Date\n${baseDesc}${c.surNotes ? '\n\nSurgery notes: ' + c.surNotes : ''}${c.schedNotes ? '\nScheduling: ' + c.schedNotes : ''}`;

  await gcalUpsertEvent(c, 'recDate', 'Records Appt', recDesc);
  await gcalUpsertEvent(c, 'surDate', 'Surgery', surDesc);

  updateGcalBadge();
}

async function gcalSyncAll() {
  if (!gcalIsConnected()) {
    showGcalStatus('✗ Authorize with Google first.', 'err');
    return;
  }
  const btn = event.target;
  btn.textContent = 'Syncing…'; btn.disabled = true;
  let count = 0;
  for (const c of cases) {
    if (c.recDate || c.surDate) {
      await syncCaseToGcal(c);
      // persist updated gcal event IDs
      await persistCase(c);
      count++;
    }
  }
  btn.textContent = '↑ Push all cases to Google Calendar';
  btn.disabled = false;
  showGcalStatus(`✓ Synced ${count} case(s) to Google Calendar.`, 'ok');
  toast(`✓ ${count} cases pushed to Google Calendar`);
}

// Restore gcal config on load
function initGcal() {
  gcalCfg = JSON.parse(localStorage.getItem('sgv4_gcal') || '{}');
  if (gcalCfg.clientId) {
    document.getElementById('gcal_clientId').value = gcalCfg.clientId;
    document.getElementById('gcal_calId').value = gcalCfg.calId || 'primary';
  }
  updateGcalBadge();
}
